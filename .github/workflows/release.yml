// Supabase Edge Function: sends a phone push notification for every new row in public.notifications.
// Triggered by a Database Webhook (Insert on "notifications"). Secrets needed (Edge Functions -> Secrets):
//   FCM_SERVICE_ACCOUNT   the whole Firebase service-account JSON
//   PUSH_WEBHOOK_SECRET   any long random text; the same text goes into the webhook header "x-webhook-secret"
// SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are provided automatically.

const SUPABASE_URL = Deno.env.get('SUPABASE_URL')!
const SERVICE_KEY = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!
const WEBHOOK_SECRET = Deno.env.get('PUSH_WEBHOOK_SECRET') ?? ''
const SA = JSON.parse(Deno.env.get('FCM_SERVICE_ACCOUNT') ?? '{}') as { project_id: string; client_email: string; private_key: string }

const enc = new TextEncoder()
const b64url = (buf: ArrayBuffer | string) => {
  const bytes = typeof buf === 'string' ? enc.encode(buf) : new Uint8Array(buf)
  let s = ''
  for (const b of bytes) s += String.fromCharCode(b)
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

let cached: { token: string; exp: number } | null = null
async function accessToken(): Promise<string> {
  const now = Math.floor(Date.now() / 1000)
  if (cached && cached.exp - 60 > now) return cached.token
  const pem = SA.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '')
  const der = Uint8Array.from(atob(pem), (c) => c.charCodeAt(0))
  const key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign'])
  const head = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }))
  const claims = b64url(JSON.stringify({
    iss: SA.client_email,
    scope: 'https://www.googleapis.com/auth/firebase.messaging',
    aud: 'https://oauth2.googleapis.com/token',
    iat: now,
    exp: now + 3600,
  }))
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, enc.encode(`${head}.${claims}`))
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: `${head}.${claims}.${b64url(sig)}` }),
  })
  const json = await res.json()
  if (!res.ok) throw new Error(`Google token error: ${JSON.stringify(json)}`)
  cached = { token: json.access_token, exp: now + (json.expires_in ?? 3600) }
  return cached.token
}

const rest = (path: string, init: RequestInit = {}) =>
  fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...init,
    headers: { apikey: SERVICE_KEY, Authorization: `Bearer ${SERVICE_KEY}`, 'Content-Type': 'application/json', ...(init.headers ?? {}) },
  })

Deno.serve(async (req) => {
  if (!WEBHOOK_SECRET || req.headers.get('x-webhook-secret') !== WEBHOOK_SECRET) return new Response('Forbidden', { status: 403 })
  try {
    const payload = await req.json()
    const rec = payload?.record as { recipient_id: string; type: string; title: string; message?: string; ticket_id?: string } | undefined
    if (payload?.type !== 'INSERT' || !rec?.recipient_id) return new Response('ignored')

    const r = await rest(`admin_devices?user_id=eq.${encodeURIComponent(rec.recipient_id)}&select=token`)
    const tokens = ((await r.json()) as { token: string }[]).map((d) => d.token)
    if (!tokens.length) return new Response('no devices')

    const access = await accessToken()
    let sent = 0
    for (const token of tokens) {
      const res = await fetch(`https://fcm.googleapis.com/v1/projects/${SA.project_id}/messages:send`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${access}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: {
            token,
            notification: { title: rec.title, body: rec.message ?? '' },
            data: { type: rec.type, ticket_id: rec.ticket_id ?? '' },
            android: {
              priority: 'HIGH',
              notification: { channel_id: 'tickets', sound: 'default', default_vibrate_timings: true },
            },
          },
        }),
      })
      if (res.ok) sent++
      else {
        const err = await res.text()
        console.error('FCM error', res.status, err)
        // phone uninstalled the app / token expired -> forget it
        if (res.status === 404 || err.includes('UNREGISTERED')) {
          await rest(`admin_devices?token=eq.${encodeURIComponent(token)}`, { method: 'DELETE' })
        }
      }
    }
    return new Response(`sent ${sent}/${tokens.length}`)
  } catch (e) {
    console.error(e)
    return new Response(String(e), { status: 500 })
  }
})
